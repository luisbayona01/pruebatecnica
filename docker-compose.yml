services:
  mysql:
    image: mysql:8
    container_name: linkhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: linkhub
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: linkhub-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: linkhub
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_NAME: LinkHub
      APP_ENV: production
      APP_DEBUG: "false"
      FRONTEND_URL: http://localhost:4201
      L5_SWAGGER_USE_ABSOLUTE_PATH: "false"
    volumes:
      - ./backend/storage:/var/www/html/storage

  backend-nginx:
    image: nginx:1.27-alpine
    container_name: linkhub-backend-nginx
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    ports:
      - "8001:80"

  frontend:
    build:
      context: ./frontend
    container_name: linkhub-frontend
    restart: unless-stopped
    depends_on:
      - backend-nginx
    ports:
      - "4201:80"

  phpmyadmin:
    image: phpmyadmin:5
    container_name: linkhub-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    ports:
      - "4202:80"

volumes:
  mysql_data: